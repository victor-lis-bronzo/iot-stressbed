# =========================================================================== #
# IoT StressBed — orquestração do testbed
# =========================================================================== #
#
# Ver: docs/architecture.md, docs/specs/infra-resource-isolation.md,
#      docs/adr/0004-cgroups-resource-isolation.md
#
# Antes do primeiro `docker compose up`:
#   1. cp .env.example .env    e troque os valores "change-me"
#   2. ./scripts/gen-certs.sh  (necessário para o mosquitto-secure)
#
# Serviços de fases futuras — NÃO definidos aqui ainda:
#   nestjs-api  (Fase 1)  — backend (auth, sensors, capture, experiments,
#                           metrics, realtime). Entra na rede stressbed-net e
#                           no cpuset da stack de observação (STACK_CPUSET).
#   nextjs-web  (Fase 4)  — dashboard.
#   attacker    (Fase 3)  — flooding/injeção via Paho; sobe sob demanda
#                           (profile separado) e recebe os limites de recurso
#                           ATTACKER_* já reservados no .env.example.

name: ${COMPOSE_PROJECT_NAME:-stressbed}

# --------------------------------------------------------------------------- #
# Rede
# --------------------------------------------------------------------------- #
# Bridge dedicada: o tráfego do experimento não se mistura com a rede default
# do Docker nem com outros containers da máquina (user story 8 da spec).
networks:
  stressbed-net:
    name: stressbed-net
    driver: bridge

services:

  # ========================================================================= #
  # mosquitto-plain — BROKER ALVO (MQTT em claro, sem autenticação)
  # ========================================================================= #
  # Aberto de propósito: é a vulnerabilidade que a IC demonstra.
  # Ver infra/mosquitto/plain/mosquitto.conf.
  mosquitto-plain:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto-plain
    hostname: mosquitto-plain

    # Não reiniciar automaticamente: se um flood do Track B derrubar o broker,
    # a queda tem que PERMANECER visível. Um restart automático mascararia
    # justamente o resultado que o experimento mede.
    restart: "no"

    # 0.0.0.0 porque o ESP32 é hardware externo na LAN e publica aqui.
    ports:
      - "${MQTT_PLAIN_PORT:-1883}:1883"

    volumes:
      - ./infra/mosquitto/plain/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

    networks:
      - stressbed-net

    # Teto de log: um message flood gera log volumoso; sem rotação isso enche
    # o disco do host e derruba a coleta junto.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # $$ escapa a interpolação do Compose para que o shell do container receba
    # $SYS literal.
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ========================================================================= #
  # mosquitto-secure — GRUPO DE CONTROLE (MQTTS: TLS + usuário/senha + ACL)
  # ========================================================================= #
  # Pré-requisito: ./scripts/gen-certs.sh (o entrypoint falha com mensagem
  # explícita se os certificados não existirem).
  mosquitto-secure:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto-secure
    hostname: mosquitto-secure

    restart: "no"

    ports:
      - "${MQTT_SECURE_PORT:-8883}:8883"

    # O entrypoint próprio materializa passwd/ACL a partir do .env e então
    # entrega o controle ao CMD (mosquitto). Roda como o usuário mosquitto
    # (uid 1883) da imagem — sem root.
    entrypoint: ["/entrypoint/docker-entrypoint.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]

    environment:
      MQTT_SECURE_USERNAME: ${MQTT_SECURE_USERNAME:?defina MQTT_SECURE_USERNAME no .env}
      MQTT_SECURE_PASSWORD: ${MQTT_SECURE_PASSWORD:?defina MQTT_SECURE_PASSWORD no .env}

    volumes:
      - ./infra/mosquitto/secure/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/secure/acl.template:/mosquitto/config/acl.template:ro
      - ./infra/mosquitto/secure/docker-entrypoint.sh:/entrypoint/docker-entrypoint.sh:ro
      # Certificados gerados por scripts/gen-certs.sh — read-only, o broker só lê.
      - ./infra/mosquitto/secure/certs:/mosquitto/certs:ro

    networks:
      - stressbed-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Healthcheck exercita o caminho completo do grupo de controle: TLS
    # (validando o certificado do servidor contra a CA), autenticação por
    # senha e a ACL de leitura de $SYS. `localhost` está no SAN do certificado.
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mosquitto_sub --cafile /mosquitto/certs/ca.crt
          -h localhost -p 8883
          -u "$$MQTT_SECURE_USERNAME" -P "$$MQTT_SECURE_PASSWORD"
          -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 5s

  # ========================================================================= #
  # postgres — estado da aplicação (usuários, sensores, metadados de run)
  # ========================================================================= #
  # NUNCA telemetria: série temporal vive no InfluxDB (ADR-0001).
  postgres:
    image: postgres:16-alpine
    container_name: stressbed-postgres
    hostname: postgres

    restart: unless-stopped

    # Só em 127.0.0.1: ao contrário dos brokers (que o ESP32 acessa pela LAN),
    # nada aqui deve ser alcançável de fora da máquina.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - stressbed-net

    # Núcleos reservados: a stack de observação não compete com o broker pelos
    # mesmos núcleos (ADR-0004, user story 5 da spec).
    cpuset: ${STACK_CPUSET:-0,1}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========================================================================= #
  # influxdb — série temporal: `telemetry`, `capture_meta` (via nestjs-api,
  # Fase 1) e `broker_metrics` (via telegraf, caminho independente — ADR-0003)
  # ========================================================================= #
  influxdb:
    image: influxdb:2.7-alpine
    container_name: stressbed-influxdb
    hostname: influxdb

    restart: unless-stopped

    ports:
      - "127.0.0.1:${INFLUXDB_PORT:-8086}:8086"

    environment:
      # Bootstrap automático na primeira subida (cria org, bucket e token).
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:?defina INFLUXDB_ADMIN_USER no .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?defina INFLUXDB_ADMIN_PASSWORD no .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?defina INFLUXDB_ORG no .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?defina INFLUXDB_BUCKET no .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?defina INFLUXDB_TOKEN no .env}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-0s}

    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
      # Scripts opcionais rodados no bootstrap (vazio nesta fase).
      - ./infra/influxdb/init:/docker-entrypoint-initdb.d:ro

    networks:
      - stressbed-net

    cpuset: ${STACK_CPUSET:-0,1}

    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ========================================================================= #
  # grafana — visualização de telemetria e de broker_metrics
  # ========================================================================= #
  grafana:
    image: grafana/grafana:11.6.0
    container_name: stressbed-grafana
    hostname: grafana

    restart: unless-stopped

    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?defina GRAFANA_ADMIN_USER no .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      # Sem acesso anônimo, coerente com ADR-0005 (nada do painel é público).
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Consumidas pelo datasource provisionado (infra/grafana/provisioning).
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}

    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - stressbed-net

    cpuset: ${STACK_CPUSET:-0,1}

    depends_on:
      influxdb:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ========================================================================= #
  # telegraf — métricas de container -> InfluxDB (`broker_metrics`)
  # ========================================================================= #
  # CAMINHO INDEPENDENTE (ADR-0003): depende apenas do socket do Docker e do
  # InfluxDB. Nada de nestjs-api aqui — durante um flood do Track B o backend
  # pode cair e esta série tem que continuar sendo gravada.
  telegraf:
    image: telegraf:1.34-alpine
    container_name: stressbed-telegraf
    hostname: telegraf

    restart: unless-stopped

    # Sem portas publicadas: telegraf só empurra dados para o InfluxDB.

    # O processo roda como o usuário `telegraf`, mas precisa de um grupo que
    # tenha leitura no socket do Docker (TELEGRAF_DOCKER_GID no .env: o gid do
    # grupo `docker` no host Linux, ou 0 no Docker Desktop).
    user: "telegraf:${TELEGRAF_DOCKER_GID:-0}"

    environment:
      TELEGRAF_INTERVAL: ${TELEGRAF_INTERVAL:-5s}
      TELEGRAF_DOCKER_ENDPOINT: unix:///var/run/docker.sock
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?defina INFLUXDB_TOKEN no .env}
      INFLUXDB_ORG: ${INFLUXDB_ORG:?defina INFLUXDB_ORG no .env}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:?defina INFLUXDB_BUCKET no .env}
      # Tag da run ativa; "none" fora de um experimento.
      RUN_ID: ${RUN_ID:-none}

    volumes:
      - ./infra/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      # Somente leitura: telegraf lê os contadores de cgroup dos containers,
      # nunca controla o daemon.
      - ${TELEGRAF_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro

    networks:
      - stressbed-net

    # Núcleos da stack de observação: o coletor precisa continuar coletando
    # justamente quando os núcleos do broker estão saturados (ADR-0004).
    cpuset: ${STACK_CPUSET:-0,1}

    depends_on:
      influxdb:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "pgrep telegraf >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# --------------------------------------------------------------------------- #
# Volumes
# --------------------------------------------------------------------------- #
volumes:
  postgres-data:
  influxdb-data:
  influxdb-config:
  grafana-data:
