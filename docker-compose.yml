# IoT StressBed — orquestração do testbed.
#
# Antes do primeiro `docker compose up`:
#   1. cp .env.example .env    e troque os valores "change-me"
#   2. ./scripts/gen-certs.sh  (necessário para o mosquitto-secure)
#
# attacker (Track A — injeção) e mock-sensor (publisher legítimo de telemetria
# simulada) já estão aqui nesta branch. nestjs-api (Fase 1) e nextjs-web
# (Fase 4) seguem fora desta branch e ainda não estão no compose.
#
# Ver: docs/architecture.md, docs/specs/infra-resource-isolation.md,
#      docs/adr/0004-cgroups-resource-isolation.md

name: ${COMPOSE_PROJECT_NAME:-stressbed}

# Bridge dedicada: o tráfego do experimento não se mistura com a rede default
# do Docker nem com outros containers da máquina (user story 8 da spec).
networks:
  stressbed-net:
    name: stressbed-net
    driver: bridge

services:

  # BROKER ALVO, aberto de propósito: é a vulnerabilidade que a IC demonstra.
  # Ver infra/mosquitto/plain/mosquitto.conf.
  mosquitto-plain:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto-plain
    hostname: mosquitto-plain

    # Se um flood do Track B derrubar o broker, a queda tem que PERMANECER
    # visível — um restart automático mascararia o resultado medido.
    restart: "no"

    # Publicado em 0.0.0.0 porque o ESP32 é hardware externo na LAN.
    ports:
      - "${MQTT_PLAIN_PORT:-1883}:1883"

    volumes:
      - ./infra/mosquitto/plain/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

    networks:
      - stressbed-net

    # Teto de log: um message flood gera log volumoso e sem rotação enche o
    # disco do host, derrubando a coleta junto.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ISOLAMENTO DE RECURSOS (ADR-0004), requisito não-funcional mais crítico do
    # projeto: sem estes limites um flood do Track B satura CPU/RAM/PIDs do
    # host, derruba a stack de observação junto com o broker e torna impossível
    # distinguir "o broker caiu" de "a máquina toda travou".
    #
    # O cpuset exclui os núcleos da stack de observação (STACK_CPUSET) e do
    # atacante (ATTACKER_CPUSET): é essa exclusão que reserva CPU para o host e
    # mantém Grafana/InfluxDB coletando com o broker saturado.
    cpuset: ${BROKER_PLAIN_CPUSET:-2}
    cpus: ${BROKER_PLAIN_CPUS:-1.0}

    # memswap_limit IGUAL a mem_limit = swap zero para o container: o ponto de
    # OOM fica determinístico e não é mascarado por paginação em disco (user
    # story 3). NUNCA aumente MEMSWAP acima de MEMORY.
    mem_limit: ${BROKER_PLAIN_MEMORY:-256m}
    memswap_limit: ${BROKER_PLAIN_MEMSWAP:-256m}

    # Contém a explosão de tarefas induzida por um connection flood antes que
    # ela esgote os PIDs do host.
    pids_limit: ${BROKER_PLAIN_PIDS:-512}

    # $$ escapa a interpolação do Compose: o container recebe $SYS literal.
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # GRUPO DE CONTROLE (mTLS + usuário/senha + ACL). Pré-requisito:
  # ./scripts/gen-certs.sh — o entrypoint falha com mensagem explícita se os
  # certificados não existirem.
  mosquitto-secure:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto-secure
    hostname: mosquitto-secure

    restart: "no"

    ports:
      - "${MQTT_SECURE_PORT:-8883}:8883"

    # O entrypoint materializa passwd/ACL a partir do .env e então entrega o
    # controle ao CMD.
    entrypoint: ["/entrypoint/docker-entrypoint.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]

    environment:
      MQTT_SECURE_USERNAME: ${MQTT_SECURE_USERNAME:?defina MQTT_SECURE_USERNAME no .env}
      MQTT_SECURE_PASSWORD: ${MQTT_SECURE_PASSWORD:?defina MQTT_SECURE_PASSWORD no .env}

    volumes:
      - ./infra/mosquitto/secure/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/secure/acl.template:/mosquitto/config/acl.template:ro
      - ./infra/mosquitto/secure/docker-entrypoint.sh:/entrypoint/docker-entrypoint.sh:ro
      - ./infra/mosquitto/secure/certs:/mosquitto/certs:ro

    networks:
      - stressbed-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Limites deliberadamente idênticos ao broker plain — ver o bloco de
    # isolamento de recursos acima.
    cpuset: ${BROKER_SECURE_CPUSET:-3}
    cpus: ${BROKER_SECURE_CPUS:-1.0}
    mem_limit: ${BROKER_SECURE_MEMORY:-256m}
    memswap_limit: ${BROKER_SECURE_MEMSWAP:-256m}
    pids_limit: ${BROKER_SECURE_PIDS:-512}

    # Exercita o caminho completo do grupo de controle: mTLS (valida o
    # certificado do servidor contra a CA E apresenta o próprio certificado de
    # cliente, exigido pelo ADR-0007), senha e ACL de leitura de $SYS.
    # `localhost` está no SAN do certificado do servidor, e os arquivos vêm de
    # /mosquitto/runtime (cópia do entrypoint) pelo mesmo motivo de permissão
    # descrito em docker-entrypoint.sh.
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mosquitto_sub --cafile /mosquitto/runtime/ca.crt
          --cert /mosquitto/runtime/client-test.crt
          --key /mosquitto/runtime/client-test.key
          -h localhost -p 8883
          -u "$$MQTT_SECURE_USERNAME" -P "$$MQTT_SECURE_PASSWORD"
          -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 5s

  # ATACANTE — Track A (injeção/spoofing). Cliente MQTT que forja leituras no
  # tópico do sensor legítimo: aceito no broker plain, rejeitado no secure (mTLS).
  # Ver attacker/README.md e attacker/python/injector.py.
  attacker:
    build:
      context: ./attacker
    container_name: attacker
    hostname: attacker

    # Sem restart: se o injetor sair (inclusive exit 1 no secure, que é o achado
    # esperado), o container não deve reviver sozinho e mascarar o resultado.
    restart: "no"

    # Sem `ports`: é sempre cliente MQTT, nunca servidor — não expõe nada.
    # Sem `healthcheck`: não há endpoint; o container fica ocioso por design.

    # Rede: dentro da stressbed-net os brokers são alcançáveis pelos hostnames
    # dos serviços (mosquitto-plain/mosquitto-secure) nas portas INTERNAS
    # (1883/8883), não por localhost nem pelas portas publicadas no host.
    # ATTACKER_CA_PATH aponta para o ca.crt montado via volume abaixo (o cálculo
    # por REPO_ROOT em injector.py não resolve dentro do container).
    environment:
      MQTT_PLAIN_HOST: mosquitto-plain
      MQTT_PLAIN_PORT: "1883"
      MQTT_SECURE_HOST: mosquitto-secure
      MQTT_SECURE_PORT: "8883"
      ATTACKER_CA_PATH: /certs/ca.crt

    # Opção B (volume) em vez de COPY no Dockerfile: os certs são regenerados por
    # ./scripts/gen-certs.sh e um bind mount reflete a regeneração sem rebuild da
    # imagem; também mantém o build context em ./attacker, sem side-effect em
    # quem assume esse contexto. Só o ca.crt é necessário — o atacante nunca
    # apresenta certificado de cliente (por isso montamos o diretório :ro).
    volumes:
      - ./infra/mosquitto/secure/certs:/certs:ro

    # depends_on leve (sem condition): só ordena a subida para que um
    # `docker compose up attacker` isolado suba os brokers junto, evitando um
    # "Connection refused" sem pista. O disparo continua sempre manual (ver CMD).
    depends_on:
      - mosquitto-plain
      - mosquitto-secure

    # O CMD da imagem é `sleep infinity`: o container fica ocioso até ser
    # disparado sob demanda via
    #   docker compose exec attacker python python/injector.py --target ...
    # O disparo é SEMPRE manual, NUNCA automático no `docker compose up`: uma
    # publicação fora de uma run com attackType=injection seria gravada pelo
    # capture como source=legit, corrompendo o KPI de taxa de sucesso de injeção
    # e violando a run única ativa do ADR-0006. A orquestração correta
    # (login -> start run -> disparo -> stop run) vive em scripts/run-experiment.sh.

    networks:
      - stressbed-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ISOLAMENTO DE RECURSOS (ADR-0004): o atacante *gera* carga (múltiplas
    # conexões/threads simultâneas) em vez de só recebê-la, por isso recebe mais
    # folga que cada broker — mas ainda contida, para que o próprio ataque nunca
    # trave o host. Roteiro completo em docs/specs/attacker-resource-limits.md.
    #
    # O cpuset (ATTACKER_CPUSET) é disjunto dos núcleos dos brokers e da stack de
    # observação: é essa exclusão que mantém Grafana/InfluxDB coletando enquanto
    # o ataque satura o broker-alvo.
    cpuset: ${ATTACKER_CPUSET:-4,5}
    cpus: ${ATTACKER_CPUS:-2.0}

    # memswap_limit IGUAL a mem_limit = swap zero: o OOM do próprio atacante fica
    # determinístico, mesmo raciocínio dos brokers. NUNCA aumente MEMSWAP acima
    # de MEMORY.
    mem_limit: ${ATTACKER_MEMORY:-512m}
    memswap_limit: ${ATTACKER_MEMSWAP:-512m}

    # PIDs alto o bastante para o ataque atingir o broker antes que o próprio
    # limite o interrompa; baixo o bastante para conter uma explosão de tarefas
    # antes de esgotar os PIDs do host.
    pids_limit: ${ATTACKER_PIDS:-2048}

  # SENSOR MOCK — publisher legítimo de telemetria simulada (temperatura/
  # umidade) nos dois brokers, sempre ativo desde o `docker compose up` (ao
  # contrário do attacker, que fica ocioso até um disparo manual). Sem uma run
  # de injeção/flood ativa, o capture grava esta telemetria como source=legit.
  # Ver scripts/mock-sensor.py.
  mock-sensor:
    build:
      context: ./scripts
      dockerfile: Dockerfile.mock-sensor
    container_name: mock-sensor
    hostname: mock-sensor

    restart: "no"

    environment:
      MOCK_SENSOR_ID: ${MOCK_SENSOR_ID:-sensor-mock-01}
      MOCK_SENSOR_INTERVAL: ${MOCK_SENSOR_INTERVAL:-2}
      MQTT_PLAIN_HOST: mosquitto-plain
      MQTT_PLAIN_PORT: "1883"
      MQTT_SECURE_HOST: mosquitto-secure
      MQTT_SECURE_PORT: "8883"
      MQTT_SECURE_USERNAME: ${MQTT_SECURE_USERNAME:?defina MQTT_SECURE_USERNAME no .env}
      MQTT_SECURE_PASSWORD: ${MQTT_SECURE_PASSWORD:?defina MQTT_SECURE_PASSWORD no .env}
      MOCK_SENSOR_CERTS_DIR: /certs

    volumes:
      - ./infra/mosquitto/secure/certs:/certs:ro

    depends_on:
      - mosquitto-plain
      - mosquitto-secure

    networks:
      - stressbed-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    cpuset: ${STACK_CPUSET:-0,1}
    mem_limit: 128m

  # Estado da aplicação (usuários, sensores, metadados de run). NUNCA
  # telemetria: série temporal vive no InfluxDB (ADR-0001).
  postgres:
    image: postgres:16-alpine
    container_name: stressbed-postgres
    hostname: postgres

    restart: unless-stopped

    # Só em 127.0.0.1: ao contrário dos brokers (que o ESP32 acessa pela LAN),
    # nada aqui deve ser alcançável de fora da máquina.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - stressbed-net

    # Núcleos reservados: a stack de observação não compete com o broker pelos
    # mesmos núcleos (ADR-0004, user story 5 da spec).
    cpuset: ${STACK_CPUSET:-0,1}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Série temporal: `telemetry` e `capture_meta` (via nestjs-api, Fase 1) e
  # `broker_metrics` (via telegraf, caminho independente — ADR-0003).
  influxdb:
    image: influxdb:2.7-alpine
    container_name: stressbed-influxdb
    hostname: influxdb

    restart: unless-stopped

    ports:
      - "127.0.0.1:${INFLUXDB_PORT:-8086}:8086"

    environment:
      # Bootstrap automático na primeira subida (cria org, bucket e token).
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:?defina INFLUXDB_ADMIN_USER no .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?defina INFLUXDB_ADMIN_PASSWORD no .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?defina INFLUXDB_ORG no .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?defina INFLUXDB_BUCKET no .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?defina INFLUXDB_TOKEN no .env}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-0s}

    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
      - ./infra/influxdb/init:/docker-entrypoint-initdb.d:ro

    networks:
      - stressbed-net

    cpuset: ${STACK_CPUSET:-0,1}

    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:11.6.0
    container_name: stressbed-grafana
    hostname: grafana

    restart: unless-stopped

    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?defina GRAFANA_ADMIN_USER no .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      # Nada do painel é público (ADR-0005).
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Consumidas pelo datasource provisionado (infra/grafana/provisioning).
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}

    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - stressbed-net

    cpuset: ${STACK_CPUSET:-0,1}

    depends_on:
      influxdb:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Métricas de container -> InfluxDB (`broker_metrics`). CAMINHO INDEPENDENTE
  # (ADR-0003): depende apenas do socket do Docker e do InfluxDB, nunca do
  # nestjs-api — durante um flood do Track B o backend pode cair e esta série
  # tem que continuar sendo gravada.
  telegraf:
    image: telegraf:1.34-alpine
    container_name: stressbed-telegraf
    hostname: telegraf

    restart: unless-stopped

    # O processo roda como `telegraf`, mas precisa de um grupo com leitura no
    # socket do Docker (TELEGRAF_DOCKER_GID no .env).
    user: "telegraf:${TELEGRAF_DOCKER_GID:-0}"

    environment:
      TELEGRAF_INTERVAL: ${TELEGRAF_INTERVAL:-5s}
      TELEGRAF_DOCKER_ENDPOINT: unix:///var/run/docker.sock
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?defina INFLUXDB_TOKEN no .env}
      INFLUXDB_ORG: ${INFLUXDB_ORG:?defina INFLUXDB_ORG no .env}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:?defina INFLUXDB_BUCKET no .env}
      # Tag da run ativa; "none" fora de um experimento.
      RUN_ID: ${RUN_ID:-none}

    volumes:
      - ./infra/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      # Read-only: telegraf lê os contadores de cgroup, nunca controla o daemon.
      - ${TELEGRAF_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro

    networks:
      - stressbed-net

    # O coletor precisa continuar coletando justamente quando os núcleos do
    # broker estão saturados (ADR-0004).
    cpuset: ${STACK_CPUSET:-0,1}

    depends_on:
      influxdb:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "pgrep telegraf >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  influxdb-data:
  influxdb-config:
  grafana-data:
