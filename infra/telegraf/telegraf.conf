# =========================================================================== #
# telegraf — coletor de métricas de saúde do broker (ADR-0003)
# =========================================================================== #
#
# CAMINHO INDEPENDENTE. Este coletor lê os cgroups dos containers pelo socket
# do Docker e escreve direto no InfluxDB. Ele NÃO conhece, NÃO consulta e NÃO
# depende do nestjs-api — que nem existe nesta fase. Essa independência é o
# ponto inteiro do ADR-0003: durante um flood do Track B, o backend pode
# saturar ou cair, e a série de saúde do broker tem que continuar sendo
# gravada, senão o experimento mede o gargalo do software de observação em vez
# da resistência real do broker.
#
# Contrato de dados (docs/architecture.md):
#   measurement `broker_metrics`, tags `broker` (plain|secure) e `run_id`.
#
# Fonte da verdade sobre saúde do broker. O `capture` do NestJS grava
# `telemetry`/`capture_meta` num pipeline separado, que nunca deve ser fundido
# com este.

# --------------------------------------------------------------------------- #
# Agente
# --------------------------------------------------------------------------- #

[agent]
  # 5s: resolução suficiente para ver a curva de degradação de um flood sem
  # inflar o volume de pontos. Parametrizado por TELEGRAF_INTERVAL no .env.
  interval = "${TELEGRAF_INTERVAL}"
  round_interval = true

  # Lote pequeno e flush frequente: sob ataque, o que importa é não perder os
  # pontos do momento da degradação por ficarem presos no buffer.
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "${TELEGRAF_INTERVAL}"
  flush_jitter = "0s"
  collection_jitter = "0s"

  # `hostname = ""` usaria o hostname do container (um id aleatório), que
  # poluiria as séries a cada recriação.
  hostname = "stressbed-host"
  omit_hostname = false

  precision = ""
  debug = false
  quiet = false
  logfile = ""

# --------------------------------------------------------------------------- #
# Tags globais
# --------------------------------------------------------------------------- #

[global_tags]
  # run_id da run ativa. Fica "none" fora de um experimento;
  # scripts/run-experiment.sh exporta o valor real e recria o container antes
  # de disparar o ataque. Vem do ambiente, NÃO de uma consulta ao backend —
  # telegraf não fala com o nestjs-api (ADR-0003).
  run_id = "${RUN_ID}"

# --------------------------------------------------------------------------- #
# Saída: InfluxDB 2.x
# --------------------------------------------------------------------------- #

[[outputs.influxdb_v2]]
  # Nome de serviço na rede stressbed-net.
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

  # Só o que veio deste pipeline vai para o InfluxDB.
  namepass = ["broker_metrics"]

# --------------------------------------------------------------------------- #
# Entrada: estatísticas de container via socket do Docker
# --------------------------------------------------------------------------- #
#
# O input `docker` lê a mesma fonte que o `docker stats` (a API do daemon, que
# expõe os contadores de cgroup do container): CPU, memória, rede e block IO,
# além do estado do container. Isso cobre o requisito do ADR-0003 sem subir um
# cAdvisor separado — cAdvisor entregaria essencialmente os mesmos contadores
# de cgroup e adicionaria um container privilegiado à stack.

[[inputs.docker]]
  endpoint = "${TELEGRAF_DOCKER_ENDPOINT}"

  # Somente os containers do experimento. `attacker` já está listado para a
  # Fase 3: um nome que ainda não existe é simplesmente ignorado.
  container_name_include = ["mosquitto-plain", "mosquitto-secure", "attacker"]

  # Containers parados também interessam: se um flood derrubar o broker, a
  # transição para "exited" é o dado científico, e um filtro por "running"
  # apagaria justamente esse instante.
  container_state_include = ["created", "restarting", "running", "removing", "paused", "exited", "dead"]

  # Métricas de Swarm não se aplicam (Compose em host único).
  gather_services = false

  # Sem séries por dispositivo (cada interface de rede / disco): os totais
  # agregados bastam, e o per-device multiplicaria as séries.
  # `perdevice = false` continua necessário: o default do plugin é true e o
  # telegraf emite DeprecationWarning enquanto ele não for desligado
  # explicitamente. As listas *_include são a forma nova de escolher o escopo.
  perdevice = false
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]

  # Labels do Docker fora: não carregam informação do experimento e
  # aumentariam a cardinalidade.
  docker_label_exclude = ["*"]

  timeout = "5s"

  # Todo o pipeline deste plugin desemboca no measurement contratado.
  # Sem isso viriam `docker_container_cpu`, `docker_container_mem`, etc.
  name_override = "broker_metrics"

# --------------------------------------------------------------------------- #
# Processadores
# --------------------------------------------------------------------------- #

# Deriva a tag `broker` (plain|secure) do nome do container, que é o
# identificador que o input do Docker fornece. Consumidores de
# `broker_metrics` filtram por `broker`, não por nome de container
# (docs/architecture.md).
[[processors.enum]]
  order = 1

  [[processors.enum.mapping]]
    tag = "container_name"
    dest = "broker"

    [processors.enum.mapping.value_mappings]
      "mosquitto-plain" = "plain"
      "mosquitto-secure" = "secure"
      # O atacante não é um broker, mas compartilha o measurement por
      # conveniência de análise (mesma janela de tempo, mesmo run_id).
      "attacker" = "attacker"
