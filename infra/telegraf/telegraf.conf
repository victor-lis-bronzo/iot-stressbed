# telegraf — fonte da verdade sobre saúde do broker (ADR-0003).
#
# CAMINHO INDEPENDENTE: lê os cgroups dos containers pelo socket do Docker e
# escreve direto no InfluxDB, sem conhecer nem consultar o nestjs-api. Durante
# um flood do Track B o backend pode cair, e esta série tem que continuar sendo
# gravada — senão o experimento mede o gargalo do software de observação em vez
# da resistência do broker. O `capture` do NestJS grava `telemetry` e
# `capture_meta` num pipeline separado, que nunca deve ser fundido com este.
#
# Contrato de dados (docs/architecture.md): measurement `broker_metrics`, tags
# `broker` (plain|secure) e `run_id`.

[agent]
  # 5s dá resolução para ver a curva de degradação de um flood sem inflar o
  # volume de pontos.
  interval = "${TELEGRAF_INTERVAL}"
  round_interval = true

  # Flush frequente: sob ataque, o que importa é não perder os pontos do
  # momento da degradação por ficarem presos no buffer.
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "${TELEGRAF_INTERVAL}"
  flush_jitter = "0s"
  collection_jitter = "0s"

  # `hostname = ""` usaria o hostname do container (um id aleatório), que
  # poluiria as séries a cada recriação.
  hostname = "stressbed-host"
  omit_hostname = false

  precision = ""
  debug = false
  quiet = false
  logfile = ""

[global_tags]
  # Vem do ambiente ("none" fora de um experimento), NÃO de uma consulta ao
  # backend: telegraf não fala com o nestjs-api (ADR-0003).
  run_id = "${RUN_ID}"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  namepass = ["broker_metrics"]

# O input `docker` lê a mesma fonte que o `docker stats` (a API do daemon, que
# expõe os contadores de cgroup): CPU, memória, rede, block IO e estado do
# container. Cobre o ADR-0003 sem subir um cAdvisor separado, que entregaria os
# mesmos contadores ao custo de um container privilegiado na stack.
[[inputs.docker]]
  endpoint = "${TELEGRAF_DOCKER_ENDPOINT}"

  # `attacker` já está listado para a Fase 3: um nome que ainda não existe é
  # simplesmente ignorado.
  container_name_include = ["mosquitto-plain", "mosquitto-secure", "attacker"]

  # Containers parados também interessam: se um flood derrubar o broker, a
  # transição para "exited" é o dado científico, e um filtro por "running"
  # apagaria justamente esse instante.
  container_state_include = ["created", "restarting", "running", "removing", "paused", "exited", "dead"]

  gather_services = false

  # Sem séries por dispositivo (os totais bastam e o per-device multiplicaria a
  # cardinalidade). `perdevice = false` explícito é necessário: o default do
  # plugin é true e o telegraf emite DeprecationWarning enquanto ele não for
  # desligado; as listas *_include são a forma nova de escolher o escopo.
  perdevice = false
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]

  # Labels do Docker não carregam informação do experimento e aumentariam a
  # cardinalidade.
  docker_label_exclude = ["*"]

  timeout = "5s"

  # Sem isto viriam `docker_container_cpu`, `docker_container_mem`, etc., em vez
  # do measurement contratado.
  name_override = "broker_metrics"

# Consumidores de `broker_metrics` filtram pela tag `broker`, não por nome de
# container (docs/architecture.md).
[[processors.enum]]
  order = 1

  [[processors.enum.mapping]]
    tag = "container_name"
    dest = "broker"

    [processors.enum.mapping.value_mappings]
      "mosquitto-plain" = "plain"
      "mosquitto-secure" = "secure"
      # O atacante não é um broker, mas compartilha o measurement por
      # conveniência de análise (mesma janela de tempo, mesmo run_id).
      "attacker" = "attacker"
