# =========================================================================== #
# mosquitto-secure — GRUPO DE CONTROLE (MQTTS, porta 8883, TLS + auth + ACL)
# =========================================================================== #
#
# Espelho endurecido do `mosquitto-plain`: mesma topologia, mesma carga, mesmos
# limites de cgroup — a ÚNICA diferença é a camada de segurança. É essa
# diferença que a IC isola ao comparar os dois brokers.
#
# Pré-requisitos (feitos fora deste arquivo):
#   1. `./scripts/gen-certs.sh` gera ca.crt / server.crt / server.key, montados
#      em /mosquitto/certs (read-only) pelo docker-compose.yml;
#   2. o entrypoint (docker-entrypoint.sh) materializa passwd e acl em
#      /tmp/mosquitto-auth a partir de MQTT_SECURE_USERNAME/PASSWORD do .env
#      e de acl.template — nenhuma credencial real é versionada.
#      Ficam em /tmp (e não num volume) porque o container roda como o usuário
#      não-privilegiado `mosquitto` (uid 1883), que não consegue escrever num
#      volume Docker recém-criado (root:root); manter o alvo de ataque do
#      Track B sem root vale mais do que um caminho bonito.
#
# Ver: docs/specs/infra-resource-isolation.md, docs/architecture.md

# --------------------------------------------------------------------------- #
# Listener TLS
# --------------------------------------------------------------------------- #

listener 8883 0.0.0.0
protocol mqtt

cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

# TLS 1.2 no mínimo. O stack TLS do ESP32 (mbedTLS) fala 1.2 de forma
# confiável; exigir 1.3 quebraria o publisher legítimo do grupo de controle.
tls_version tlsv1.2

# Autenticação do CLIENTE é por usuário/senha, não por certificado mútuo:
# require_certificate false mantém o grupo de controle na configuração
# "TLS + auth básica" descrita na spec (mTLS está fora de escopo — ver
# "Out of Scope" em docs/specs/infra-resource-isolation.md). O certificado do
# servidor continua obrigatório e validado pelos clientes contra ca.crt.
require_certificate false

# --------------------------------------------------------------------------- #
# Autenticação e autorização
# --------------------------------------------------------------------------- #

# Diferença central em relação ao broker plain: CONNECT sem credencial válida
# é recusado (CONNACK 0x05 / rc=5, "not authorised").
allow_anonymous false
password_file /tmp/mosquitto-auth/passwd

# ACL por usuário: nem mesmo um cliente autenticado pode assinar `#` ou
# publicar fora do namespace previsto. Gerada pelo entrypoint a partir de
# acl.template.
acl_file /tmp/mosquitto-auth/acl

# --------------------------------------------------------------------------- #
# Persistência
# --------------------------------------------------------------------------- #

# Igual ao broker plain: estado limpo por run, para que a comparação
# plain vs secure não sofra de condição inicial diferente.
persistence false

# --------------------------------------------------------------------------- #
# Log
# --------------------------------------------------------------------------- #

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# --------------------------------------------------------------------------- #
# Limites
# --------------------------------------------------------------------------- #

# Deliberadamente idêntico ao broker plain (sem teto interno): se o secure
# tivesse max_connections restritivo e o plain não, o Track B compararia dois
# brokers com defesas diferentes e a conclusão sobre TLS+auth ficaria
# confundida com um efeito de rate limiting. A contenção é do cgroup
# (ADR-0004), igual nos dois.
max_connections -1

sys_interval 10
