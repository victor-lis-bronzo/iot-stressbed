# mosquitto-secure — GRUPO DE CONTROLE (mTLS + senha + ACL).
#
# Espelho endurecido do `mosquitto-plain`: mesma topologia, mesma carga, mesmos
# limites de cgroup — a ÚNICA diferença é a camada de segurança.
#
# Todos os caminhos lidos aqui apontam para /mosquitto/runtime, materializado
# pelo docker-entrypoint.sh, e não para o bind mount: o broker larga privilégio
# para o usuário `mosquitto` (uid 1883) e a leitura direta de arquivos do host
# falharia por permissão de forma dependente do uid/gid da máquina. Os
# certificados vêm de ./scripts/gen-certs.sh.
#
# Ver: docs/specs/infra-resource-isolation.md, docs/architecture.md,
#      docs/adr/0007-mtls-on-secure-broker.md

listener 8883 0.0.0.0
protocol mqtt

# Explícito em vez de confiar no default: o broker que sofre o ataque do
# Track B nunca roda como root.
user mosquitto

cafile   /mosquitto/runtime/ca.crt
certfile /mosquitto/runtime/server.crt
keyfile  /mosquitto/runtime/server.key

# O mbedTLS do ESP32 fala 1.2 de forma confiável; exigir 1.3 quebraria o
# publisher legítimo do grupo de controle.
tls_version tlsv1.2

# Primeira das DUAS camadas de autenticação (ADR-0007). Certificado ausente,
# expirado ou de outra CA aborta o HANDSHAKE TLS: o cliente vê erro de TLS, e
# não um CONNACK "not authorised".
require_certificate true

# CRÍTICO: manter false. Com `true` o mosquitto usa o CN do certificado como
# username e NÃO consulta o password_file, DESLIGANDO a camada de senha que o
# ADR-0007 exige como segunda camada independente. Com false, username/senha do
# CONNECT continuam sendo verificados e a ACL casa pelo username do MQTT, não
# pelo CN — quebrar uma camada não concede acesso.
use_identity_as_username false

# Segunda camada: mesmo com certificado válido, o CONNECT sem credencial é
# recusado (CONNACK 0x05).
allow_anonymous false
password_file /mosquitto/runtime/passwd

# Nem um cliente autenticado pode assinar `#` ou publicar fora do namespace
# previsto.
acl_file /mosquitto/runtime/acl

# Igual ao broker plain, para que a comparação não sofra de condição inicial
# diferente.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# Sem teto interno, idêntico ao broker plain: com max_connections restritivo só
# aqui, o Track B confundiria o efeito de TLS+auth com rate limiting. A
# contenção é do cgroup (ADR-0004), igual nos dois.
max_connections -1

sys_interval 10
