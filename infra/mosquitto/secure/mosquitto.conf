# =========================================================================== #
# mosquitto-secure — GRUPO DE CONTROLE (MQTTS 8883: mTLS + senha + ACL)
# =========================================================================== #
#
# Espelho endurecido do `mosquitto-plain`: mesma topologia, mesma carga, mesmos
# limites de cgroup — a ÚNICA diferença é a camada de segurança. É essa
# diferença que a IC isola ao comparar os dois brokers.
#
# Pré-requisitos (feitos fora deste arquivo):
#   1. `./scripts/gen-certs.sh` gera ca.crt / server.crt / server.key e os
#      certificados de CLIENTE (client-capture.*, client-test.*) exigidos pelo
#      mTLS, montados em /mosquitto/certs (read-only) pelo docker-compose.yml;
#   2. o entrypoint (docker-entrypoint.sh) monta /mosquitto/runtime com passwd
#      (gerado por mosquitto_passwd a partir de MQTT_SECURE_USERNAME/PASSWORD
#      do .env), acl (de acl.template) e uma cópia dos certificados com dono
#      correto — nenhuma credencial real é versionada.
#      Todos os caminhos que o broker LÊ apontam para /mosquitto/runtime, e não
#      para o bind mount, porque o mosquitto larga privilégio para o usuário
#      `mosquitto` (uid 1883) e a leitura direta de arquivos do host falharia
#      por permissão de forma dependente do uid/gid da máquina.
#
# Ver: docs/specs/infra-resource-isolation.md, docs/architecture.md,
#      docs/adr/0007-mtls-on-secure-broker.md

# --------------------------------------------------------------------------- #
# Listener TLS
# --------------------------------------------------------------------------- #

listener 8883 0.0.0.0
protocol mqtt

# Larga privilégio depois de abrir a porta: o broker que sofre o ataque do
# Track B nunca roda como root. Explícito em vez de confiar no default.
user mosquitto

cafile   /mosquitto/runtime/ca.crt
certfile /mosquitto/runtime/server.crt
keyfile  /mosquitto/runtime/server.key

# TLS 1.2 no mínimo. O stack TLS do ESP32 (mbedTLS) fala 1.2 de forma
# confiável; exigir 1.3 quebraria o publisher legítimo do grupo de controle.
tls_version tlsv1.2

# mTLS OBRIGATÓRIO (ADR-0007) — primeira das DUAS camadas de autenticação.
#
# O cliente precisa apresentar um certificado assinado pela mesma CA local
# (cafile acima). Certificado ausente, expirado ou de outra CA aborta o
# HANDSHAKE TLS — a conexão morre antes do CONNECT do MQTT, e por isso o
# cliente vê um erro de TLS, não um CONNACK "not authorised".
#
# Certificados de cliente são emitidos por scripts/gen-certs.sh
# (client-capture.* para o adapter `capture`, client-test.* para testes
# manuais e para o healthcheck deste container).
require_certificate true

# CRÍTICO: manter false. Com `use_identity_as_username true` o mosquitto usa o
# CN do certificado como username e NÃO consulta o password_file — o que
# DESLIGARIA a camada de senha, exatamente o contrário do que o ADR-0007 pede
# ("a autenticação por usuário/senha é mantida como uma segunda camada, não
# substituída pelo mTLS"). Com false, o username/senha do CONNECT continuam
# sendo verificados contra passwd e a ACL continua casando pelo username do
# MQTT, não pelo CN. As duas camadas ficam independentes: quebrar uma não
# concede acesso.
use_identity_as_username false

# --------------------------------------------------------------------------- #
# Autenticação e autorização
# --------------------------------------------------------------------------- #

# SEGUNDA camada (a primeira é o mTLS acima): mesmo um cliente que passou pelo
# handshake TLS com certificado válido tem o CONNECT recusado sem credencial
# válida (CONNACK 0x05 / rc=5, "not authorised").
allow_anonymous false
password_file /mosquitto/runtime/passwd

# ACL por usuário: nem mesmo um cliente autenticado pode assinar `#` ou
# publicar fora do namespace previsto. Gerada pelo entrypoint a partir de
# acl.template.
acl_file /mosquitto/runtime/acl

# --------------------------------------------------------------------------- #
# Persistência
# --------------------------------------------------------------------------- #

# Igual ao broker plain: estado limpo por run, para que a comparação
# plain vs secure não sofra de condição inicial diferente.
persistence false

# --------------------------------------------------------------------------- #
# Log
# --------------------------------------------------------------------------- #

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# --------------------------------------------------------------------------- #
# Limites
# --------------------------------------------------------------------------- #

# Deliberadamente idêntico ao broker plain (sem teto interno): se o secure
# tivesse max_connections restritivo e o plain não, o Track B compararia dois
# brokers com defesas diferentes e a conclusão sobre TLS+auth ficaria
# confundida com um efeito de rate limiting. A contenção é do cgroup
# (ADR-0004), igual nos dois.
max_connections -1

sys_interval 10
