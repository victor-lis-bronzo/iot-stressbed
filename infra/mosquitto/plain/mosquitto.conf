# =========================================================================== #
# mosquitto-plain — broker ALVO do experimento (MQTT em claro, porta 1883)
# =========================================================================== #
#
# ATENÇÃO — ESTA CONFIGURAÇÃO É INSEGURA DE PROPÓSITO.
#
# Este broker é o alvo do estudo: ele reproduz o deployment MQTT "de fábrica"
# encontrado em campo — sem TLS e sem autenticação. As vulnerabilidades que a
# IC demonstra (interceptação e injeção no Track A, DoS no Track B) dependem
# desta abertura. NÃO adicione TLS, senha, ACL ou rate limit aqui: o grupo de
# controle endurecido é o `mosquitto-secure` (8883), e comparar os dois é o
# objetivo do experimento.
#
# Só suba este broker na rede bridge isolada `stressbed-net` do
# docker-compose.yml, nunca exposto à internet.
#
# Ver: docs/spec.md, docs/architecture.md,
#      docs/specs/track-a-confidentiality-integrity.md,
#      docs/specs/track-b-availability-dos.md

# --------------------------------------------------------------------------- #
# Listener
# --------------------------------------------------------------------------- #

listener 1883 0.0.0.0
protocol mqtt

# Sem TLS: o tráfego trafega em claro e é legível por qualquer sniffer na rede
# (premissa do Track A — interceptação).

# --------------------------------------------------------------------------- #
# Autenticação — ausente, intencionalmente
# --------------------------------------------------------------------------- #

# Qualquer cliente conecta, assina `#` e publica em qualquer tópico sem
# credencial. É exatamente a falha que o experimento mede.
allow_anonymous true

# Sem password_file, sem acl_file, sem require_certificate.

# --------------------------------------------------------------------------- #
# Persistência
# --------------------------------------------------------------------------- #

# Persistência DESLIGADA: cada run de experimento precisa partir de um estado
# limpo e reprodutível; mensagens retidas/sessões sobreviventes de uma run
# anterior contaminariam a medição da run seguinte.
persistence false

# --------------------------------------------------------------------------- #
# Log
# --------------------------------------------------------------------------- #

# Log em stdout para que `docker compose logs` e o journald do host capturem
# tudo — sem arquivo de log dentro do container (evita crescer disco durante
# um flood do Track B).
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Conexões/desconexões são o sinal mais importante do Track B (connection
# flood): manter explicitamente ligado.
connection_messages true

# --------------------------------------------------------------------------- #
# Limites — NÃO usar para "proteger" o broker
# --------------------------------------------------------------------------- #

# Deliberadamente sem `max_connections`, `max_inflight_messages`,
# `max_queued_messages` restritivos e sem `memory_limit`: quem contém o dano
# de um ataque é o cgroup do container (cpuset/cpus/memory/pids-limit no
# docker-compose.yml, ADR-0004), não o broker. Se o broker se autolimitasse,
# a medição do Track B mediria a defesa do Mosquitto em vez da exaustão real
# de recursos, e o ponto de falha deixaria de ser comparável ao do broker
# secure.
max_connections -1

# --------------------------------------------------------------------------- #
# Tópico $SYS
# --------------------------------------------------------------------------- #

# $SYS/# publica contadores internos (clientes conectados, mensagens, bytes) a
# cada 10s. Fonte complementar de observabilidade; a fonte da verdade sobre
# saúde do broker é telegraf lendo os cgroups do container (ADR-0003).
sys_interval 10
