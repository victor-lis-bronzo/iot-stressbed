# mosquitto-plain — broker ALVO do experimento.
#
# ESTA CONFIGURAÇÃO É INSEGURA DE PROPÓSITO: reproduz o deployment MQTT "de
# fábrica" encontrado em campo, e as vulnerabilidades que a IC demonstra
# (Track A: interceptação e injeção; Track B: DoS) dependem dessa abertura.
# NÃO adicione TLS, senha, ACL ou rate limit aqui — o grupo de controle
# endurecido é o `mosquitto-secure` (8883), e comparar os dois é o objetivo do
# experimento. Só suba este broker na bridge isolada `stressbed-net`.
#
# Ver: docs/spec.md, docs/architecture.md,
#      docs/specs/track-a-confidentiality-integrity.md,
#      docs/specs/track-b-availability-dos.md

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous true

# Estado limpo por run: mensagens retidas e sessões sobreviventes de uma run
# anterior contaminariam a medição da run seguinte.
persistence false

# Log só em stdout: arquivo de log dentro do container encheria o disco durante
# um flood do Track B.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Conexões/desconexões são o sinal mais importante do Track B (connection flood).
connection_messages true

# Sem teto interno de conexões: quem contém o dano é o cgroup do container
# (docker-compose.yml, ADR-0004). Se o broker se autolimitasse, o Track B
# mediria a defesa do Mosquitto em vez da exaustão real de recursos.
max_connections -1

sys_interval 10
